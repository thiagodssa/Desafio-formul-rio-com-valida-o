<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Desafio Formulário com validação </title>
</head>

<body>
    <div class="container">

        <h2 class="titulo">FICOU COM DÚVIDA?<br> NOS MANDE UMA MENSAGEM!</h2>
        <p class="paragrafo">caso tenha ficado com qualquer dúvida basta nos mandar uma mensagem e entraremos em
            contato em menos de 24h.
        </p>

    </div>
    <div class="formulario">
        <input type="text" name="nome" id="nome" placeholder="Nome completo *" class="input">
        <div class="campo-obrigatorio">
        </div>
        <input type="email" name="email" id="email" placeholder="Email *" class="input">
        <div class="campo-obrigatorio">
        </div>
        <input type="tel" name="telefone" id="telefone" placeholder="Telefone *" class="input">
        <div class="campo-obrigatorio">
        </div>
        <input type="text" name="mensagem" id="mensagem" placeholder="Mensagem *" class="mensagem input">
        <div class="campo-obrigatorio">
        </div>
        <p class="campos-obrigatorios">*campos obrigatórios</p>
        <button class="botao-enviar" id="botao">Enviar</button>
    </div>

    <script src="./src/js/index.js"></script>

</body>

</html>
